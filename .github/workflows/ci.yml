name: GE1013 source-and-code checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_external:
        description: "Also call the live Edge TTS service (sends one test sentence)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        shell: bash  # -eo pipefail: a failing command inside a pipe fails the step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Install and require real FFmpeg, fonts, OpenSSH, git
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-dejavu-core openssh-client git
          command -v ffmpeg
          command -v ffprobe
          command -v ssh-keygen
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Compile scripts
        run: python -m compileall -q .
      - name: Check manifest / timeline structure
        run: python validate.py
      - name: Deterministic tests (real FFmpeg renders; no skips, no expected failures allowed)
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          if grep -E "skipped|expected failure|unexpected success" unittest.log; then
            echo "::error::Tests were skipped or marked expected-failure; CI requires every test to really run and pass"
            exit 1
          fi
      - name: Security boundaries
        run: |
          test ! -f group.json
          test ! -f review.json
          test ! -d review.sigs
          test ! -e assets/voiceover.wav
          test -z "$(git ls-files 'assets/*' ':!assets/.gitkeep' 'output/*')"

  external-services:
    if: github.event_name == 'workflow_dispatch' && inputs.run_external
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt && sudo apt-get update -q && sudo apt-get install -y ffmpeg
      - name: Live Edge TTS word-boundary check
        run: RUN_EXTERNAL=1 python -m unittest discover -s tests_external -v
